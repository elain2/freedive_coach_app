<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0A2E4F"/>
      <stop offset="100%" style="stop-color:#05090F"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#5EB6F7"/>
      <stop offset="100%" style="stop-color:#2F86D6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="224" fill="url(#bgGrad)"/>

  <!-- Water surface wave -->
  <path d="M0 380 Q256 320 512 380 T1024 380 L1024 1024 L0 1024 Z" fill="#0E2438" opacity="0.6"/>

  <!-- Diver silhouette -->
  <g transform="translate(512, 520)">
    <!-- Body -->
    <ellipse cx="0" cy="-80" rx="45" ry="55" fill="url(#waveGrad)"/>
    <!-- Head -->
    <circle cx="0" cy="-160" r="40" fill="url(#waveGrad)"/>
    <!-- Arms spread -->
    <path d="M-45 -80 Q-120 -60 -140 20" stroke="url(#waveGrad)" stroke-width="28" stroke-linecap="round" fill="none"/>
    <path d="M45 -80 Q120 -60 140 20" stroke="url(#waveGrad)" stroke-width="28" stroke-linecap="round" fill="none"/>
    <!-- Legs/Fins -->
    <path d="M-20 -25 Q-30 80 -60 180" stroke="url(#waveGrad)" stroke-width="26" stroke-linecap="round" fill="none"/>
    <path d="M20 -25 Q30 80 60 180" stroke="url(#waveGrad)" stroke-width="26" stroke-linecap="round" fill="none"/>
    <!-- Fin tips -->
    <path d="M-60 180 Q-100 240 -80 280" stroke="url(#waveGrad)" stroke-width="20" stroke-linecap="round" fill="none"/>
    <path d="M60 180 Q100 240 80 280" stroke="url(#waveGrad)" stroke-width="20" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Bubbles -->
  <circle cx="380" cy="300" r="12" fill="#5EB6F7" opacity="0.7"/>
  <circle cx="420" cy="260" r="8" fill="#5EB6F7" opacity="0.5"/>
  <circle cx="360" cy="240" r="6" fill="#5EB6F7" opacity="0.4"/>
  <circle cx="640" cy="280" r="10" fill="#5EB6F7" opacity="0.6"/>
  <circle cx="680" cy="240" r="7" fill="#5EB6F7" opacity="0.5"/>

  <!-- Depth line (rope) -->
  <line x1="512" y1="200" x2="512" y2="350" stroke="#5EB6F7" stroke-width="4" stroke-dasharray="12,8" opacity="0.6"/>
</svg>
