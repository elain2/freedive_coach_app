name: freedive_coach
description: Dive Coach Cat - AI-powered freediving companion app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  audioplayers: ^5.2.1
  vibration: ^1.8.4
  shared_preferences: ^2.2.2
  wakelock_plus: ^1.1.4
  sqflite: ^2.3.0
  path: ^1.8.3
  image_picker: ^1.0.4
  path_provider: ^2.1.1
  http: ^1.1.0
  video_player: ^2.8.1
  flutter_dotenv: ^5.1.0
  video_thumbnail: ^0.5.6
  speech_to_text: ^7.4.0
  flutter_sound: ^9.2.13
  fl_chart: ^0.69.0
  share_plus: ^7.2.1
  file_picker: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  sqflite_common_ffi: ^2.3.0+4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#7DD3C0"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#03141D"
    theme_color: "#4FE0CC"
  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/icon/
    - .env
